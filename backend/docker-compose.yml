services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trackwise
      POSTGRES_PASSWORD: trackwise
      POSTGRES_DB: trackwise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackwise"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # amd64 so the Essentia wheel (linux x86_64 only) installs; runs under
    # emulation on Apple Silicon. db stays on its native arch.
    platform: linux/amd64
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      # Override so the backend reaches the db service inside the compose network.
      DATABASE_URL: postgresql+psycopg2://trackwise:trackwise@db:5432/trackwise
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
